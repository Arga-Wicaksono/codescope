[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "codescope"
version = "1.2.0"
description = "Python SDK for CodeScope — repository intelligence for AI and developers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Arga Wicaksono"},
]
keywords = ["codescope", "code-intelligence", "symbol-lookup", "repository", "ai-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/Arga-Wicaksono/codescope"
Repository = "https://github.com/Arga-Wicaksono/codescope"

[tool.setuptools.packages.find]
where = ["."]
