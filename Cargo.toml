[package]
name = "codescope"
version = "1.2.0"
edition = "2021"
description = "Repository Intelligence Engine — fast code retrieval, symbol lookup, and AI-ready context extraction for developers and AI agents"
authors = ["Arga Wicaksono"]
license = "MIT"
repository = "https://github.com/Arga-Wicaksono/codescope"
keywords = ["cli", "search", "code-intelligence", "symbol-lookup", "ripgrep", "repository", "ai-tools", "context-engine", "developer-tools", "fuzzy"]
categories = ["Command Line Interface", "Development tools", "Search"]
homepage = "https://github.com/Arga-Wicaksono/codescope"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
fuzzy-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
regex = "1"
colored = "2"
is-terminal = "0.4"
rayon = "1"
dirs = "5"
dialoguer = { version = "0.11", features = ["fuzzy-select"], optional = true }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false, optional = true }
scraper = { version = "0.22", optional = true }
clap_complete = "4"
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
textwrap = { version = "0.16", optional = true }

[features]
default = ["web-search", "interactive", "tui"]
web-search = ["reqwest", "scraper"]
interactive = ["dialoguer"]
tui = ["ratatui", "crossterm", "textwrap"]

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
clap_mangen = "0.2"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "search_bench"
harness = false

[[bench]]
name = "symbol_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
strip = true

[[bin]]
name = "cs"
path = "src/main.rs"

[lib]
name = "codescope"
path = "src/lib.rs"
