name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Lint & Format ────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Clippy (all features)
        run: cargo clippy --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --no-default-features -- -D warnings

  # ─── Test (default features) ─────────────────────────────────────────
  test-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests (default features)
        run: cargo test --lib

  # ─── Test (no default features — minimal) ────────────────────────────
  test-minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests (minimal, no features)
        run: cargo test --no-default-features --lib

  # ─── Test (all features) ─────────────────────────────────────────────
  test-all-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests (all features)
        run: cargo test --all-features --lib

  # ─── Binary smoke test ────────────────────────────────────────────────
  smoke-test:
    runs-on: ubuntu-latest
    needs: [test-default]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Smoke test: --help
        run: ./target/release/cs --help
      - name: Smoke test: file search
        run: |
          cd /tmp && mkdir -p smoke-test && cd smoke-test
          touch main.rs lib.rs config.toml
          /home/runner/work/codescope/codescope/target/release/cs file "main"
      - name: Smoke test: content search
        run: |
          echo 'fn hello() { println!("hello"); }' > /tmp/smoke-test/main.rs
          /home/runner/work/codescope/codescope/target/release/cs content "hello" -C 1
      - name: Smoke test: completions
        run: ./target/release/cs completions bash > /dev/null

  # ─── Cross-compile check ──────────────────────────────────────────────
  cross-compile:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: x86_64-apple-darwin
          - target: aarch64-apple-darwin
          - target: x86_64-pc-windows-msvc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Check compilation
        run: cargo check --release --target ${{ matrix.target }}
